<html>
  <head>
    <h1>Registrazione</h1>
  </head>
  <body>
    <form>
      <label for="name">Nome</label>
      <input type="text" id="name" name="name" required /><br /><br />

      <label for="cognome">Cognome</label>
      <input type="text" id="cognome" name="cognome" required /><br /><br />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required /><br /><br />

      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        required
        minlength="8"
        placeholder="Minimo 8 caratteri"
      />
      <br /><br />

      <label for="telefono">Telefono:</label>
      <input
        type="telefono"
        id="telefono"
        name="telefono"
        required
        minlength="9"
        placeholder="Minimo 9 caratteri"
      />
      <br /><br />

      <label>Sesso:</label>
      <input type="radio" id="maschio" name="sesso" value="maschio" required />
      Maschio
      <input type="radio" id="femmina" name="sesso" value="femmina" required />
      Femmina <br /><br />

      <label for="terms">
        <input type="checkbox" id="terms" name="terms" required /> Accetto i
        termini e condizioni
      </label>
      <br /><br />

      <button type="submit">Invia</button>
      <button type="reset">Annulla</button>
    </form>
  </body>
</html>
